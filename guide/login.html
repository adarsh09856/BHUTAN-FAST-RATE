<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>Guide Sign In — Bhutan Fast Rate Tours</title>
  <link rel="stylesheet" href="../css/tour-theme.css">
  <style>
    :root, html, body { color-scheme: light !important; }
    input { color-scheme: light !important; background-color: #ffffff !important; color: #1f2923 !important; }
  </style>
</head>
<body class="bg-[#14231E] min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-[#E05A47] text-white font-black text-xl flex items-center justify-center mx-auto shadow">B</div>
      <h1 class="text-xl font-black text-[#14231E]">Certified Guide Field Portal</h1>
      <p class="text-xs text-zinc-500">Sign in with your guide email and password to view daily trip rosters and report check-ins.</p>
    </div>
    <form id="guideLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Guide Email</label>
        <input type="email" id="gEmail" value="kinley@bhutanfastratetours.bt" required class="w-full px-4 py-3 rounded-lg border border-zinc-300 text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Password</label>
        <input type="password" id="gPass" value="guide123" required class="w-full px-4 py-3 rounded-lg border border-zinc-300 text-sm">
      </div>
      <button type="submit" class="w-full py-3.5 rounded-lg bg-[#E05A47] hover:bg-[#c94937] text-white font-black text-xs uppercase tracking-wider shadow">
        Access Field Dashboard
      </button>
    </form>
  </div>
  <script>
    document.getElementById('guideLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('bfr_guide_auth', 'kinley');
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
