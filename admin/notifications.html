<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>Notifications — Bhutan Fast Rate Operations</title>
  <link rel="stylesheet" href="../css/tour-theme.css">
  <link rel="stylesheet" href="css/admin-theme.css">
</head>
<body class="admin-layout">
  <!-- Dynamic Sidebar -->
  <aside id="adminSidebar" class="admin-sidebar"></aside>

  <!-- Main Workspace -->
  <div class="admin-main">
    <header class="admin-header">
      <div class="flex items-center gap-3">
        <button id="sidebarToggle" class="lg:hidden p-2 text-zinc-400 hover:text-white rounded">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-base font-extrabold text-white">Notifications</h1>
      </div>
      <div class="flex items-center gap-4 text-xs">
        <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">API Online</span>
        <a href="notifications.html" class="p-2 rounded-lg bg-zinc-800 text-zinc-300 hover:text-white">🔔</a>
      </div>
    </header>

    <main class="p-6 sm:p-8 space-y-6">
      
  <div class="stat-card space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-extrabold text-white">System Notification Center</h2>
      <button onclick="AdminApp.showToast('All notifications marked as read.')" class="text-xs font-bold text-zinc-400 hover:text-white">
        Mark All as Read
      </button>
    </div>

    <div class="space-y-2 text-xs">
      <div class="p-4 bg-zinc-800 rounded-xl border border-zinc-700 flex justify-between items-center">
        <div>
          <div class="font-bold text-white text-sm">Passport Scans Uploaded</div>
          <div class="text-zinc-400">Dr. Evelyn Martinez uploaded color passport bio-page for booking BFR-2026-8841.</div>
        </div>
        <span class="badge badge-green">NEW</span>
      </div>
      <div class="p-4 bg-zinc-800 rounded-xl border border-zinc-700 flex justify-between items-center">
        <div>
          <div class="font-bold text-white text-sm">Wire Payment Verified</div>
          <div class="text-zinc-400">$5,180 received for Essential Bhutan Heritage.</div>
        </div>
        <span class="text-zinc-500">2h ago</span>
      </div>
    </div>
  </div>

    </main>
  </div>

  <script src="../js/api-client.js"></script>
  <script src="js/admin-app.js"></script>
  <script>
    AdminApp.requireAuth();
    AdminApp.renderSidebar('notifications');
    const toggle = document.getElementById('sidebarToggle');
    if (toggle) {
      toggle.addEventListener('click', () => {
        document.getElementById('adminSidebar').classList.toggle('open');
      });
    }
  </script>
</body>
</html>
