<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>Staff Login — Bhutan Fast Rate Operations Center</title>
  <link rel="stylesheet" href="../css/tour-theme.css">
  <link rel="stylesheet" href="css/admin-theme.css">
</head>
<body class="admin-layout min-h-screen flex items-center justify-center p-4" style="justify-content:center;align-items:center;">
  <div class="stat-card w-full max-w-md p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-[#0B2A22] border border-[#C9A24B]/50 text-[#C9A24B] rounded-full font-serif font-black text-2xl flex items-center justify-center mx-auto shadow-lg">B</div>
      <h1 class="text-2xl font-bold text-white tracking-wide">OPERATIONS CENTER</h1>
      <p class="text-xs text-zinc-400">Department of Tourism Certified Back-Office Portal</p>
    </div>

    <div id="loginError" class="hidden admin-alert admin-alert-error" role="alert"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="loginEmail" class="block text-xs font-bold text-zinc-300 mb-1">Staff Email or Username</label>
        <input type="text" id="loginEmail" autocomplete="username" placeholder="staff@bhutanfastratetours.bt" required class="w-full px-4 py-3 rounded-lg border border-zinc-600 text-sm font-medium">
      </div>
      <div>
        <label for="loginPass" class="block text-xs font-bold text-zinc-300 mb-1">Password</label>
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="Enter your staff password" required class="w-full px-4 py-3 rounded-lg border border-zinc-600 text-sm font-medium">
      </div>

      <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 rounded-lg bg-[#C9A24B] hover:bg-[#E4C87E] text-[#0B2A22] font-black text-xs uppercase tracking-wider transition-all shadow-md">
        Sign In to Operations
      </button>
    </form>

    <div class="p-4 rounded-xl bg-zinc-900 border border-zinc-700 text-xs text-zinc-400 space-y-1.5">
      <div class="font-bold text-zinc-200">Authorized Staff Access Only</div>
      <p class="leading-relaxed">Sign in with your assigned Super Admin, Operations Admin, Concierge, or Finance Officer credentials. All sessions are JWT-authenticated and audited.</p>
      <div class="pt-1 flex items-center justify-between text-[11px]">
        <a href="../index.html" class="text-zinc-400 hover:text-white">← Public Website</a>
        <a href="../guide/login.html" class="text-[#C9A24B] hover:underline font-bold">Guide Field Portal →</a>
      </div>
    </div>
  </div>

  <script src="../js/api-client.js"></script>
  <script src="js/admin-app.js"></script>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('loginEmail');
      const passInput = document.getElementById('loginPass');
      const errorBox = document.getElementById('loginError');
      const submitBtn = document.getElementById('loginSubmitBtn');

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.classList.add('hidden');
      }

      // Redirect silently if a valid active staff token is already stored
      document.addEventListener('DOMContentLoaded', async () => {
        const existingToken = window.ApiClient.getToken('admin');
        if (!existingToken) return;
        try {
          const me = await window.ApiClient.getAdminMe();
          if (me && me.success && me.user) {
            window.ApiClient.setAdminSession(existingToken, me.user);
            window.location.href = 'dashboard.html';
          }
        } catch (_) {
          window.ApiClient.clearPortalSession('admin');
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email = emailInput.value.trim();
        const password = passInput.value;

        if (!email || !password) {
          showError('Please enter both your staff email/username and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying Credentials...';

        try {
          const res = await window.ApiClient.adminLogin(email, password);
          if (res && res.success && res.token) {
            window.location.href = 'dashboard.html';
            return;
          }
          showError((res && res.error) || 'Invalid staff credentials.');
        } catch (err) {
          if (err && err.status === 401) {
            showError(err.message || 'Invalid email/username or password.');
          } else if (err && err.status === 403) {
            showError(err.message || 'Your account does not have Admin Portal access or is deactivated.');
          } else {
            showError((err && err.message) || 'Unable to reach operations server. Please check connection.');
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Operations';
        }
      });
    })();
  </script>
</body>
</html>
