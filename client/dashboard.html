<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>My Trip Dashboard — Client Portal | Bhutan Fast Rate Tours</title>
  <link rel="stylesheet" href="../css/tour-theme.css">
  <style>
    :root, html, body { color-scheme: light !important; }
    input, textarea, select {
      color-scheme: light !important;
      background-color: #ffffff !important;
      color: #1f2923 !important;
      -webkit-text-fill-color: #1f2923 !important;
    }
  </style>
</head>
<body class="bg-[#F8FAF9] text-[#1F2923] min-h-screen flex flex-col font-sans antialiased">
  <header class="sticky top-0 z-50 bg-[#14231E] text-white border-b border-white/10 shadow-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="dashboard.html" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-[#E05A47] text-white font-black flex items-center justify-center text-sm">B</div>
        <div class="font-extrabold text-sm uppercase">Traveler Portal</div>
      </a>
      <nav class="flex items-center gap-4 text-xs font-bold uppercase tracking-wider text-zinc-300">
        <a href="dashboard.html" class="text-[#E05A47]">My Trip</a>
        <a href="documents.html" class="hover:text-white">Documents</a>
        <a href="itinerary.html" class="hover:text-white">Itinerary</a>
        <a href="../track-visa.html" class="hover:text-white">Track Visa</a>
        <a href="../index.html" class="hover:text-white text-zinc-400">Exit</a>
      </nav>
    </div>
  </header>

  <main class="py-10 max-w-6xl mx-auto px-4 sm:px-6 flex-1 space-y-6 w-full" id="clientDashboardContent">
    <div class="py-16 text-center text-zinc-400">
      <div class="inline-block w-8 h-8 border-4 border-[#E05A47] border-t-transparent rounded-full animate-spin mb-3"></div>
      <div>Loading Your Bhutan Reservation &amp; Visa Status...</div>
    </div>
  </main>

  <footer class="bg-[#0E1915] text-zinc-400 py-6 text-center text-xs border-t border-white/10">
    &copy; 2026 Bhutan Fast Rate Tours • Client Self-Service Portal • Hotline: +975 17 654 321
  </footer>

  <script src="../js/api-client.js"></script>
  <script>
    async function loadClientTrip() {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref') || localStorage.getItem('bfr_client_ref') || 'BFR-2026-8841';

      try {
        const res = await ApiClient.trackBooking(ref);
        const container = document.getElementById('clientDashboardContent');

        if (!res.success || !res.booking) {
          container.innerHTML = `
            <div class="bg-white p-8 rounded-2xl border border-zinc-200 text-center space-y-4">
              <h2 class="text-xl font-bold text-red-500">Trip Reference Not Found</h2>
              <p class="text-xs text-zinc-500">Could not locate booking "${ref}".</p>
              <form onsubmit="event.preventDefault(); window.location.href='dashboard.html?ref=' + document.getElementById('newRef').value;" class="max-w-xs mx-auto flex gap-2">
                <input type="text" id="newRef" placeholder="BFR-2026-XXXX" class="px-3 py-2 border rounded text-xs font-mono font-bold flex-1">
                <button type="submit" class="px-4 py-2 bg-[#E05A47] text-white font-bold text-xs rounded">Find</button>
              </form>
            </div>
          `;
          return;
        }

        const b = res.booking;
        const isApproved = ['approved', 'clearance_letter_issued'].includes(b.visa_status);
        const isPaid = (b.deposit_paid_usd >= b.total_price_usd) || b.payment_status === 'Paid in Full';

        container.innerHTML = `
          <div class="bg-white p-6 sm:p-8 rounded-2xl border border-zinc-200 shadow-sm space-y-6">
            <div class="flex flex-wrap items-start justify-between gap-4 pb-6 border-b border-zinc-200">
              <div>
                <span class="px-2.5 py-0.5 rounded ${isApproved ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} font-bold text-xs uppercase">
                  ${(b.visa_status || 'Under Review').replace(/_/g, ' ')}
                </span>
                <h1 class="text-2xl font-black text-[#14231E] mt-2">${b.tour_title}</h1>
                <p class="text-xs text-zinc-500 mt-1">Booking Ref: <strong class="font-mono text-zinc-800">${b.id}</strong> • Traveler: <strong>${b.lead_name}</strong> • Dates: <strong>${b.travel_dates || (b.travel_date_start + ' to ' + b.travel_date_end)}</strong></p>
              </div>
              <div class="text-right">
                <span class="text-xs text-zinc-400">Total Investment</span>
                <div class="text-2xl font-black text-[#E05A47]">$${Number(b.total_price_usd).toLocaleString()}</div>
                <span class="text-xs font-bold ${isPaid ? 'text-emerald-600' : 'text-amber-600'}">
                  ${isPaid ? '✓ Fully Settled' : '⚠️ Deposit Paid · Balance Pending'}
                </span>
              </div>
            </div>

            <!-- Official Visa Clearance Box -->
            <div class="p-6 rounded-xl ${isApproved ? 'bg-emerald-50 border border-emerald-200' : 'bg-orange-50 border border-orange-200'} space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase ${isApproved ? 'text-emerald-800' : 'text-[#E05A47]'}">ROYAL BHUTAN IMMIGRATION CLEARANCE</span>
                <span class="badge ${isApproved ? 'badge-green' : 'badge-amber'}">${isApproved ? 'ACTIVE' : 'IN PROCESS'}</span>
              </div>
              <div class="text-sm font-bold text-[#14231E]">
                Official Visa Clearance Number: <span class="font-mono ${isApproved ? 'text-emerald-700 font-black' : 'text-zinc-500'}">${b.visa_clearance_number || 'Pending Final Concierge Approval'}</span>
              </div>
              <p class="text-xs text-zinc-600 leading-relaxed">
                ${isApproved 
                  ? 'Your official e-Visa clearance is registered with Bhutan Department of Immigration. Present this number at the Drukair/Bhutan Airlines check-in desk and Paro Airport border control.'
                  : 'Your application is under active processing with the Royal Government. As soon as approved, your official clearance number will appear here.'}
              </p>
              ${isApproved ? `
                <a href="../track-visa.html?ref=${b.id}" class="inline-block px-4 py-2 rounded-lg bg-emerald-600 text-white font-bold text-xs uppercase tracking-wider hover:bg-emerald-500">
                  View Full Verification Letter
                </a>
              ` : ''}
            </div>

            <!-- Trip Guide Info -->
            <div class="grid sm:grid-cols-2 gap-4 text-xs">
              <div class="p-4 rounded-xl bg-zinc-50 border border-zinc-200 space-y-1">
                <span class="text-zinc-400 uppercase font-bold">Your Assigned Senior Guide</span>
                <div class="font-bold text-sm text-[#14231E]">${b.guide ? b.guide.name : 'Kinley Tshering'}</div>
                <p class="text-zinc-600">Certified Cultural &amp; High Altitude Guide (${b.guide ? b.guide.phone : '+975 77 123 456'})</p>
              </div>
              <div class="p-4 rounded-xl bg-zinc-50 border border-zinc-200 space-y-1">
                <span class="text-zinc-400 uppercase font-bold">Private Vehicle &amp; Chauffeur</span>
                <div class="font-bold text-sm text-[#14231E]">${b.guide ? (b.guide.vehicle || 'Toyota Prado SUV') : 'Toyota Land Cruiser (BP-1-A8921)'}</div>
                <p class="text-zinc-600">Dedicated chauffeur for all valley transfers &amp; luggage</p>
              </div>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-zinc-100 text-xs text-zinc-400">
              <div>Need assistance? WhatsApp our 24/7 Operations Desk at <strong class="text-zinc-700">+975 17 654 321</strong></div>
              <a href="documents.html" class="text-[#E05A47] font-bold hover:underline">Upload Additional Passports →</a>
            </div>
          </div>
        `;
      } catch (err) {
        console.error('Error loading client dashboard:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadClientTrip);
  </script>
</body>
</html>
