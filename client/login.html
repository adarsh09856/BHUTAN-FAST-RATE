<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>Client Sign In — Bhutan Fast Rate Tours</title>
  <link rel="stylesheet" href="../css/tour-theme.css">
  <style>
    :root, html, body { color-scheme: light !important; }
    input { color-scheme: light !important; background-color: #ffffff !important; color: #1f2923 !important; }
  </style>
</head>
<body class="bg-[#0E1915] min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-2xl space-y-6 border border-zinc-200">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-[#E05A47] text-white font-black text-xl flex items-center justify-center mx-auto shadow">B</div>
      <h1 class="text-xl font-black text-[#14231E]">Traveler Self-Service Portal</h1>
      <p class="text-xs text-zinc-500">Sign in with your booking reference and email address to manage your trip and visa clearance.</p>
    </div>
    <form id="clientLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Booking Reference</label>
        <input type="text" id="cRef" value="BFR-2026-8841" required class="w-full px-4 py-3 rounded-lg border border-zinc-300 text-sm font-bold uppercase">
      </div>
      <div>
        <label class="block text-xs font-bold text-zinc-700 mb-1">Lead Traveler Email</label>
        <input type="email" id="cEmail" value="evelyn.m@example.com" required class="w-full px-4 py-3 rounded-lg border border-zinc-300 text-sm">
      </div>
      <button type="submit" class="w-full py-3.5 rounded-lg bg-[#E05A47] hover:bg-[#c94937] text-white font-black text-xs uppercase tracking-wider shadow">
        Access My Trip
      </button>
    </form>
  </div>
  <script>
    document.getElementById('clientLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const ref = document.getElementById('cRef').value;
      localStorage.setItem('bfr_client_ref', ref);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
